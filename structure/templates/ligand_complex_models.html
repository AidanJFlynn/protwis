{% extends "home/base.html" %}
{% load static %}

{% block addon_css %}
    <link rel="stylesheet" href="{% static '/home/css/frameworks/datatables/datatables_bundle-3.1.4_min.css' %}">
    <link rel="stylesheet" href="{% static '/home/css/frameworks/select2/4.1.0/select2.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/tablemanager.css' %}">
    <style type="text/css">
        @media (min-width: 1600px){
            #content {
                width: 1570px;
            }
        }
        @media (min-width: 1800px){
            #content {
                width: 1770px;
            }
        }
    </style>
{% endblock %}

{% block content %}
<div style='overflow-y:hidden;'>
    <table class="display compact" id='ligand_complex_models_table'>
        <!-- Dependencies for ligand structure popover -->
            <script src="{% static '/home/js/PeptideLayoutEngine.js' %}"></script>
            <script src="{% static 'home/js/openchemlib-full.js' %}"></script>
        <!-- End dependencies -->
        <script type="module">
            // Populate ligand complex models table using TableManager
            import { TableManager } from "{% static 'home/js/tablemanager/tablemanager.js' %}";
            import { InjectorTemplates } from "{% static 'home/js/tablemanager/injectors/injectortemplates.js' %}";

            let config = null;
            try {
                config = await TableManager.fetchConfiguration(
                    'ligand_complex_models_table', //dataTableConfigName
                    'serverside', //dataTableConfigVariant
                    'ligand_complex_models_table', //columnConfigName
                    'basic') //columnConfigVariant

            } catch(error) {
                console.error('Error fetching configuration:', error);
            }

            if (config){
                // Initialize the table
                let ligandComplexModelsTable = new TableManager(config.columnsSpecifications, 'ligand_complex_models_table');

                const configuration = {
                    ligand_type_json_id:"mol_modality",
                    ligand_sequence_json_id:"sequence",
                    ligand_smiles_json_id:"smiles_for_image",
                    ligand_image_url_json_id:"ligand_image_url",
                    noImageUrl: "{% static '/home/images/No_image_available.svg' %}"
                };

                ligandComplexModelsTable.cellInjectors.registerInjector("structurePopover",
                    (cell, cellData, rowData, rowIndex, colIndex, tableManagerReference) => {
                    // Requires dependencies: PeptideLayoutEngine.js and openchemlib-full.js
                    InjectorTemplates.addChemicalStructureImagePopOver(cell, cellData, rowData, rowIndex, colIndex, tableManagerReference, configuration);
                    }
                );

                ligandComplexModelsTable.initialiseDataTable(config.datatableConfiguration);
            }
        </script>
    </table>
</div>
<br>
{% endblock %}

{% block addon_js %}
    <script src="{% static '/home/js/frameworks/datatables/datatables_3.1.4_bundle.js' %}"></script>
    <script src="{% static '/home/js/frameworks/select2/4.1.0/select2.min.js' %}"></script>
{% endblock %}
