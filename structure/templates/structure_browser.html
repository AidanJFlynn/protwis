{% extends "home/base.html" %}
{% load static %}

{% block addon_css %}
    <link rel="stylesheet" href="{% static '/home/css/frameworks/datatables/datatables_bundle-3.1.4_min.css' %}">
    <link rel="stylesheet" href="{% static '/home/css/frameworks/select2/4.1.0/select2.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/tablemanager.css' %}">
    <link href="{% static 'home/css/modal.css' %}" rel="stylesheet">
    <style type="text/css">
        @media (min-width: 1600px){
            #content {
                width: 1570px;
            }
        }
        @media (min-width: 1800px){
            #content {
                width: 1770px;
            }
        }
        #structure-browser-selection-count {
            margin-bottom: 6px;
        }
    </style>
{% endblock %}

{% block content %}
<div id="structure-browser-selection-count">0 structure(s) selected</div>

<div style='overflow-y:hidden;'>
    <table class="display compact" id="structure_browser_table">
        <script type="module">
            // Populate structure browser table using TableManager
            import { TableManager } from "{% static 'home/js/tablemanager/tablemanager.js' %}";
            import { InjectorTemplates } from "{% static 'home/js/tablemanager/injectors/injectortemplates.js' %}";

            let config = null;
            try {
                config = await TableManager.fetchConfiguration(
                    'structure_browser_table', //dataTableConfigName
                    'clientside', //dataTableConfigVariant
                    'structure_browser_table', //columnConfigName
                    'basic') //columnConfigVariant
            } catch(error) {
                console.error('Error fetching configuration:', error);
            }

            if (config) {
                // Initialize the table
                const structureBrowserTable = new TableManager(config.columnsSpecifications, 'structure_browser_table');

                // Register a super header injector to add info-icon to "Receptor State" header
                structureBrowserTable.primaryHeaderInjectors.registerInjector("ReceptorStateInfo", function(cellElementArray) {
                    let popoverContent = "<b>GPCR structure state classification</b><br>GPCRdb calculates a ‘degree active’ percent value for each structure. " + 
                    "Fully inactive state structures (0% active) are defined based on a maximum Cα atom distance between class-specific residue pairs " + 
                    "A: 11.9Å between 2x46 and 6x37, B1: 13.0Å between 2x53 and 6x42, C: 14.5Å between 2x43 and 6x39, and F: 13.0Å between 2x43 and 6x30. " +
                    "These distance cut-offs were defined based on the best correlation with structures reported as inactive in their publications. " +
                    "Fully active state structures (100% active) are defined as G protein or arrestin bound. These fully inactive and active state reference " +
                    "structures are used to measure the conformational similarity of and to classify all other structures into the same categories or to an " +
                    "intermediate state category for classes A and B1 (classes C and F have no intermediate state structures). The conformational similarity " + 
                    "measure is based on all-to-all Cα atom distances between class-specific generic residue pairs. A few outlier structures that have a very " +
                    "low similarity to both inactive and active state reference structures are classified as 'Other' e.g., the structure of the platelet-activating " +
                    "receptor binding the antagonist foropafant."
                    return InjectorTemplates.addInfoIconPopover(cellElementArray, popoverContent);
                });

                structureBrowserTable.primaryHeaderInjectors.registerInjector("StructureDescDocs", function(cellElementArray) {
                    return InjectorTemplates.addDocsIconLink(cellElementArray, "https://docs.gpcrdb.org/structures.html#structure-descriptors");
                });

                structureBrowserTable.primaryHeaderInjectors.registerInjector("RefinedStructureDocs", function(cellElementArray) {
                    return InjectorTemplates.addDocsIconLink(cellElementArray, "https://docs.gpcrdb.org/structures.html#refined-structures");
                });

                structureBrowserTable.initialiseDataTable(config.datatableConfiguration);
                window.tableManagers = window.tableManagers || {};
                window.tableManagers.structureBrowserTable = structureBrowserTable;

                // Selected structure counter
                const selectionCount = document.getElementById("structure-browser-selection-count");
                structureBrowserTable.eventPubSub.subscribe("checkboxStateChanged", function() {
                    selectionCount.textContent = `${structureBrowserTable.state.activeCheckBoxes.size} structure(s) selected`;
                });
            }
        </script>
    </table>
</div>
<br>
{% endblock %}

{% block addon_js %}
    <script src="{% static 'home/js/gpcrdb.js' %}"></script>
    <script src="{% static 'home/js/browser_functions.js' %}"></script>
    <script src="{% static '/home/js/frameworks/datatables/datatables_3.1.4_bundle.js' %}"></script>
    <script src="{% static '/home/js/frameworks/select2/4.1.0/select2.min.js' %}"></script>
{% endblock %}
