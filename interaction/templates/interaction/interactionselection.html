{% extends "home/base.html" %}
{% load static %}

{% block addon_css %}
  <link rel="stylesheet" href="{% static '/home/css/frameworks/datatables/datatables_bundle-3.1.4_min.css' %}">
  <link rel="stylesheet" href="{% static '/home/css/frameworks/select2/4.1.0/select2.css' %}">
  <link rel="stylesheet" href="{% static 'home/css/tablemanager.css' %}">
  <link rel="stylesheet" href="{% static 'home/css/interaction/interaction_selection.css' %}" type="text/css">
{% endblock %}

{% block content %}
<div class="interaction-header">
  <h2>Select a structure-ligand interaction</h2>
  <div class="interaction-header-buttons">
    <button type="button" class="btn btn-primary btn-inactive" id="btn-go-interaction" data-inactive-tooltip="Please select a structure-ligand interaction from the table to proceed.">Show interaction</button>
    <button type="button" class="btn btn-success btn-inactive" id="btn-open-interaction" data-inactive-tooltip="Please select a structure-ligand interaction from the table to proceed.">Show interaction in new tab</button>
  </div>
</div>

<div style='overflow-y:hidden;'>
  <table class="display compact" id="interaction_selection_table">
    <script type="module">
      // Populate the structure picker (structures with ligand interactions only) using TableManager
      import { TableManager } from "{% static 'home/js/tablemanager/tablemanager.js' %}";
      import { InjectorTemplates } from "{% static 'home/js/tablemanager/injectors/injectortemplates.js' %}";

      let config = null;
      try {
        config = await TableManager.fetchConfiguration(
          'structure_browser_table', //dataTableConfigName
          'clientside_ligand_interactions', //dataTableConfigVariant
          'structure_browser_table', //columnConfigName
          'ligand_interactions') //columnConfigVariant
      } catch(error) {
        console.error('Error fetching configuration:', error);
      }

      if (config) {
        // Initialize the table; its checkbox column is single select
        const interactionSelectionTable = new TableManager(config.columnsSpecifications, 'interaction_selection_table');

        // Register a super header injector to add info-icon to "Receptor State" header
        interactionSelectionTable.superHeaderInjectors.registerInjector("Receptor State", function(cellElementArray) {
          return InjectorTemplates.addInfoIconLink(cellElementArray, "https://docs.gpcrdb.org/structures.html#structure-descriptors");
        });

        interactionSelectionTable.initialiseDataTable(config.datatableConfiguration);
        window.tableManagers = window.tableManagers || {};
        window.tableManagers.interactionSelectionTable = interactionSelectionTable;

        const selectedPdbCode = () => {
          const selected = [...interactionSelectionTable.state.activeCheckBoxes.values()][0];
          return selected ? selected.data.pdb_code : null;
        };

        interactionSelectionTable.eventPubSub.subscribe("checkboxStateChanged", function() {
          const nothingSelected = !selectedPdbCode();
          document.querySelectorAll("#btn-go-interaction, #btn-open-interaction")
            .forEach((button) => button.classList.toggle("btn-inactive", nothingSelected));
        });

        function goToInteraction(newTab) {
          const pdbCode = selectedPdbCode();
          if (!pdbCode) return;
          const url = "/interaction/" + pdbCode;
          newTab ? window.open(url, "_blank") : window.location.href = url;
        }
        document.getElementById("btn-go-interaction").addEventListener("click", () => goToInteraction(false));
        document.getElementById("btn-open-interaction").addEventListener("click", () => goToInteraction(true));
      }
    </script>
  </table>
</div>
<br>
{% endblock %}

{% block addon_js %}
  <script src="{% static '/home/js/frameworks/datatables/datatables_3.1.4_bundle.js' %}"></script>
  <script src="{% static '/home/js/frameworks/select2/4.1.0/select2.min.js' %}"></script>
{% endblock %}
